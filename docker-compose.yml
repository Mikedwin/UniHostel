version: '3.8'

services:
  backend:
    image: node:20-alpine
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/unihostel
      - REDIS_URL=redis://redis:6379
      # Add other essential environment variables from .env here or use env_file
      # For simplicity, we'll use env_file below
    env_file:
      - .env
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:5000"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    env_file:
      - .env
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional: Mailhog for email testing (uncomment to use)
  # mailhog:
  #   image: mailhog/mailhog
  #   ports:
  #     - "8025:8025"   # UI
  #     - "1025:1025"   # SMTP
  #   # Add environment variables if needed, e.g.:
  #   # environment:
  #   #   - MH_STORAGE=maildir
  #   #   - MH_MAILDIR_PATH=/maildir
  #   #   - MH_UI_BIND_ADDR=0.0.0.0:8025
  #   #   - MH_API_BIND_ADDR=0.0.0.0:8025

volumes:
  mongo-data: